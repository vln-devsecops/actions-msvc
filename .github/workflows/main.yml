name: msvc-dev-cmd

on:
  pull_request:
  push:
    branches:
      - master
      - dev
      - main
      - release/*
  schedule:
    - cron: '0 6 * * *'

# The `dev` branch's branch protection requires specific check-run names by
# exact string match (Settings > Branches > required status checks). The
# `test` and `alias-arch` jobs below derive their check names from their
# `name:` template plus each matrix entry (e.g. "default (windows-2022, VS
# 2022)"), so adding, removing, or renaming a matrix entry changes which
# check names actually get reported - and any required check that's no
# longer reported blocks every future PR forever (see #10, where this
# happened within a day of the requirement being set up). Whenever this
# matrix changes, update the required status checks list on `dev` to match
# in the same PR.
jobs:
  test:
    name: default (${{ matrix.runner }}, VS ${{ matrix.vsversion }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            vsversion: "2022"
            supports_arm32: true
          - runner: windows-2025
            vsversion: "2026"
            supports_arm32: false
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
      - name: Download Internet
        run: npm install
      - name: Run eslint
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Enable Developer Command Prompt (amd64)
        uses: ./
        with:
          arch: amd64
          vsversion: ${{ matrix.vsversion }}
      - name: Compile and run some C code (amd64)
        shell: cmd
        run: |
          cl.exe hello.c
          hello.exe
      - name: Enable Developer Command Prompt (amd64_x86)
        uses: ./
        with:
          arch: amd64_x86
          vsversion: ${{ matrix.vsversion }}
      - name: Compile and run some C code (x86)
        shell: cmd
        run: |
          cl.exe hello.c
          hello.exe
      - name: Enable Developer Command Prompt (amd64_arm)
        if: matrix.supports_arm32
        uses: ./
        with:
          arch: amd64_arm
          vsversion: ${{ matrix.vsversion }}
      - name: Compile some C code (arm)
        if: matrix.supports_arm32
        shell: cmd
        run: |
          cl.exe /c hello.c
          dumpbin /headers hello.obj
      - name: Enable Developer Command Prompt (amd64_arm64)
        uses: ./
        with:
          arch: amd64_arm64
          vsversion: ${{ matrix.vsversion }}
      - name: Compile some C code (arm64)
        shell: cmd
        run: |
          cl.exe /c hello.c
          dumpbin /headers hello.obj
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
      - run: npm ci
      - run: npm audit --audit-level=moderate --omit=dev
      - run: npm audit --audit-level=critical
  alias-arch:
    name: arch aliases (${{ matrix.runner }}, VS ${{ matrix.vsversion }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            vsversion: "2022"
          - runner: windows-2025
            vsversion: "2026"
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
      - name: Download Internet
        run: npm install
      - name: Enable Developer Command Prompt
        uses: ./
        with:
          arch: Win32
          vsversion: ${{ matrix.vsversion }}
      - name: Compile and run some C code
        shell: cmd
        run: |
          cl.exe hello.c
          hello.exe
